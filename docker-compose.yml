services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qualivision_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/qualivision.db
      - PROJECT_NAME=QualiVision AI API
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qualivision_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
